name: C#
output_subdirectory: csharp

# ── Macro library ─────────────────────────────────────────────────────────────
macro_library: macros.vm

# ── Package / namespace computation ──────────────────────────────────────────
package_separator: "."
package_case: preserve

# ── Iteration strategy ────────────────────────────────────────────────────────
iteration:
  strategy: per_construct
  # Module segments preserve case (FACE/DM/SampleModel); one .cs per public type.
  path: "{modules}/{name}.cs"

# ── Template routing ──────────────────────────────────────────────────────────
templates:
  struct:
    template: class.cs.vm
  enum:
    template: enum.cs.vm
  interface:
    template: interface.cs.vm
  template_inst:
    template: template_inst.cs.vm
  union:
    template: union.cs.vm
  const:
    template: const.cs.vm

# ── Type maps (used by TypeResolver / $types) ─────────────────────────────────
primitive_types:
  SHORT: short
  INT16: short
  LONG: int
  INT32: int
  LONG_LONG: long
  INT64: long
  UNSIGNED_SHORT: ushort
  UINT16: ushort
  UNSIGNED_LONG: uint
  UINT32: uint
  UNSIGNED_LONG_LONG: ulong
  UINT64: ulong
  FLOAT: float
  DOUBLE: double
  LONG_DOUBLE: decimal
  CHAR: char
  WIDE_CHAR: char
  OCTET: byte
  INT8: byte
  UINT8: byte
  BOOLEAN: bool

parameterized_types:
  string: string
  wstring: string
  sequence: "IList<{element}>"
  array: "{element}[]"

# FACE namespace typedef aliases → C# types
scoped_overrides:
  # ulong
  "::FACE::GUID_TYPE": ulong
  "FACE::GUID_TYPE": ulong
  "::FACE::MESSAGE_INSTANCE_GUID_TYPE": ulong
  "FACE::MESSAGE_INSTANCE_GUID_TYPE": ulong
  "::FACE::UnsignedLongLong": ulong
  "FACE::UnsignedLongLong": ulong
  # long
  "::FACE::DURATION_TIME_TYPE": long
  "FACE::DURATION_TIME_TYPE": long
  "::FACE::ABSOLUTE_TIME_TYPE": long
  "FACE::ABSOLUTE_TIME_TYPE": long
  "::FACE::SYSTEM_TIME_TYPE": long
  "FACE::SYSTEM_TIME_TYPE": long
  "::FACE::TIMEOUT_TYPE": long
  "FACE::TIMEOUT_TYPE": long
  "::FACE::TRANSACTION_ID_TYPE": long
  "FACE::TRANSACTION_ID_TYPE": long
  "::FACE::SEQUENCE_NUMBER_TYPE": long
  "FACE::SEQUENCE_NUMBER_TYPE": long
  "::FACE::LongLong": long
  "FACE::LongLong": long
  "::FACE::UnsignedLong": long
  "FACE::UnsignedLong": long
  # int
  "::FACE::Long": int
  "FACE::Long": int
  # short
  "::FACE::Short": short
  "FACE::Short": short
  # ushort
  "::FACE::UnsignedShort": ushort
  "FACE::UnsignedShort": ushort
  # float
  "::FACE::Float": float
  "FACE::Float": float
  # double
  "::FACE::Double": double
  "FACE::Double": double
  # decimal
  "::FACE::LongDouble": decimal
  "FACE::LongDouble": decimal
  # bool
  "::FACE::Boolean": bool
  "FACE::Boolean": bool
  # byte
  "::FACE::Octet": byte
  "FACE::Octet": byte
  # char
  "::FACE::Char": char
  "FACE::Char": char
  "::FACE::WChar": char
  "FACE::WChar": char
  # string
  "::FACE::STRING_TYPE": string
  "FACE::STRING_TYPE": string
  "::FACE::WSTRING_TYPE": string
  "FACE::WSTRING_TYPE": string
  "::FACE::UNBOUNDED_STRING_TYPE": string
  "FACE::UNBOUNDED_STRING_TYPE": string

# C# value types + string — used by $types.isImmutable() in copyExpr macro
# (equivalent to CsharpTypeHelper.isValueType())
immutable_types:
  - short
  - ushort
  - int
  - uint
  - long
  - ulong
  - float
  - double
  - decimal
  - char
  - byte
  - bool
  - string
boxed_types: {}

# ── Naming ────────────────────────────────────────────────────────────────────
reserved_prefix: "FACE_"

# C# keywords and contextual keywords
reserved_words:
  - abstract
  - as
  - base
  - bool
  - break
  - byte
  - case
  - catch
  - char
  - checked
  - class
  - const
  - continue
  - decimal
  - default
  - delegate
  - do
  - double
  - else
  - enum
  - event
  - explicit
  - extern
  - false
  - finally
  - fixed
  - float
  - for
  - foreach
  - goto
  - if
  - implicit
  - in
  - int
  - interface
  - internal
  - is
  - lock
  - long
  - namespace
  - new
  - "null"
  - object
  - operator
  - out
  - override
  - params
  - private
  - protected
  - public
  - readonly
  - ref
  - return
  - sbyte
  - sealed
  - short
  - sizeof
  - stackalloc
  - static
  - string
  - struct
  - switch
  - this
  - throw
  - "true"
  - try
  - typeof
  - uint
  - ulong
  - unchecked
  - unsafe
  - ushort
  - using
  - virtual
  - void
  - volatile
  - while
  - add
  - alias
  - ascending
  - async
  - await
  - by
  - descending
  - dynamic
  - equals
  - from
  - get
  - global
  - group
  - into
  - join
  - let
  - nameof
  - on
  - orderby
  - partial
  - record
  - remove
  - select
  - set
  - unmanaged
  - value
  - var
  - when
  - where
  - with
  - yield

# ── Static files (FACE §K.4 framework exception classes) ─────────────────────
static_files:
  - template: BadParamException.cs.vm
    path: FACE/BadParamException.cs
    skip_if_exists: true
  - template: DataConversionException.cs.vm
    path: FACE/DataConversionException.cs
    skip_if_exists: true
